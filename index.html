<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Unemployment Map</title>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <div class="loader-title">Unemployment Map</div>
      <div class="loader-status" id="loader-status">Loading…</div>
      <div class="loader-bar"><div id="loader-progress"></div></div>
    </div>
  </div>

  <div id="app">

    <!-- Mobile open button -->
    <button id="sidebar-toggle" aria-label="Open menu">☰</button>

    <!-- ── Sidebar ────────────────────────────────────────── -->
    <aside id="sidebar">

      <div class="sidebar-header">
        <div>
          <h1>US Unemployment</h1>
          <p class="sidebar-sub">BLS LAUS · Census ACS</p>
        </div>
        <button id="sidebar-close" aria-label="Close">✕</button>
      </div>

      <!-- Search -->
      <div class="sidebar-section">
        <div class="search-wrap">
          <input type="text" id="search-input"
                 placeholder="Search state or county…"
                 autocomplete="off" spellcheck="false">
          <button id="search-clear" class="hidden" aria-label="Clear">✕</button>
          <div id="search-results" class="hidden"></div>
        </div>
      </div>

      <!-- Selected area -->
      <div class="sidebar-section">
        <div class="section-label">Selected</div>
        <div id="detail-placeholder" class="placeholder-text">
          Click a state or county
        </div>
        <div id="detail-card" class="hidden">
          <div class="detail-type"  id="detail-type"></div>
          <div class="detail-name"  id="detail-name"></div>
          <div class="detail-rate-row">
            <span class="detail-rate" id="detail-rate"></span>
            <span class="detail-rank" id="detail-rank"></span>
          </div>
          <div class="detail-period" id="detail-period"></div>
          <div id="trend-loading" class="hidden trend-loading">Loading trend…</div>
          <div id="trend-wrap" class="hidden">
            <div class="trend-label">Annual trend</div>
            <svg id="trend-chart"></svg>
          </div>
        </div>
      </div>

      <!-- Filter -->
      <div class="sidebar-section">
        <div class="section-label">
          Filter by rate
          <button id="filter-reset" class="reset-btn">Reset</button>
        </div>
        <div class="filter-row">
          <span class="filter-lbl">Min</span>
          <input type="range" id="filter-min" min="0" max="20" step="0.5" value="0">
          <span class="filter-val" id="filter-min-val">0%</span>
        </div>
        <div class="filter-row">
          <span class="filter-lbl">Max</span>
          <input type="range" id="filter-max" min="0" max="20" step="0.5" value="20">
          <span class="filter-val" id="filter-max-val">20%</span>
        </div>
      </div>

      <!-- Rankings -->
      <div class="sidebar-section rankings-section">
        <div class="section-label">
          Rankings
          <span class="view-badge" id="view-badge">States</span>
        </div>
        <div class="rank-tabs">
          <button class="rank-tab active" data-dir="high">▲ Highest</button>
          <button class="rank-tab"        data-dir="low">▼ Lowest</button>
        </div>
        <div id="rankings-list"></div>
      </div>

      <div class="sidebar-footer">
        <a href="https://www.bls.gov/lau/" target="_blank" rel="noopener">BLS LAUS</a>
        &nbsp;·&nbsp;
        <a href="https://www.census.gov/programs-surveys/acs/" target="_blank" rel="noopener">Census ACS</a>
      </div>

    </aside><!-- /sidebar -->

    <!-- ── Map ───────────────────────────────────────────── -->
    <div id="map-container">
      <div id="map"></div>

      <!-- Hover tooltip -->
      <div id="tooltip" class="hidden">
        <div class="tt-name" id="tt-name"></div>
        <div class="tt-rate" id="tt-rate"></div>
        <div class="tt-meta" id="tt-meta"></div>
      </div>

      <!-- Minimal zoom controls -->
      <div id="map-controls">
        <button id="btn-zoom-in"  title="Zoom in">+</button>
        <button id="btn-zoom-out" title="Zoom out">−</button>
      </div>
    </div>

  </div><!-- /app -->

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="app.js"></script>
</body>
</html>
